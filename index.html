<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hospital policy explorer</title>
<style>
  :root {
    --bg:#ffffff; --panel:#f4f6fa; --card:#ffffff; --text:#1b2430; --muted:#667385; --border:#dde3ec;
    --accent:#1b6ef3; --accent-text:#ffffff; --bot:#eef1f6; --hl:#fff6c9;
    --c-fg:#17703f; --c-bg:#e3f4ea; --r-fg:#8f5400; --r-bg:#fdf0d8; --x-fg:#b3261e; --x-bg:#fbe6e4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#12161c; --panel:#1a1f27; --card:#1d222b; --text:#e8edf4; --muted:#93a0b2; --border:#2e3644;
      --accent:#4b8dff; --accent-text:#0c1220; --bot:#242a35; --hl:#3b3817;
      --c-fg:#5fd18f; --c-bg:#17362a; --r-fg:#f0b45a; --r-bg:#3a2e14; --x-fg:#ff8f87; --x-bg:#3d1f1d;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg);
         color: var(--text); display: flex; flex-direction: column; }
  button, select, input { font: inherit; color: inherit; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 10px; }
  .top { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .top strong { font-size: 15px; white-space: nowrap; }
  .top .sub { color: var(--muted); font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mtabs { display: none; gap: 4px; }
  .mtabs button { padding: 5px 12px; border: 1px solid var(--border); background: var(--card); border-radius: 999px; cursor: pointer; }
  .mtabs button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 330px minmax(0, 1fr) 380px; }
  .left, .center, .chat { min-height: 0; overflow: auto; }
  .left { padding: 14px; border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; gap: 14px; }
  .center { padding: 14px 18px; }
  .chat { border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  label.f { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  select, .ms-btn, .search { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
  select:focus, .ms-btn:focus, .search:focus, #input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  /* multi-select dropdown */
  .ms { position: relative; }
  .ms-btn { display: flex; justify-content: space-between; align-items: center; gap: 8px; cursor: pointer; text-align: left; }
  .ms-btn .caret { color: var(--muted); }
  .ms-pop { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px); background: var(--card);
            border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.18); padding: 8px; }
  .ms-pop[hidden] { display: none; }
  .ms-search { width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); margin-bottom: 6px; }
  .ms-list { max-height: 300px; overflow: auto; }
  .ms-group { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 8px 6px 3px; }
  .ms-item { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; cursor: pointer; }
  .ms-item:hover { background: var(--panel); }
  .ms-item .r { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .ms-empty { padding: 10px 6px; color: var(--muted); }
  .ms-foot { display: flex; justify-content: space-between; padding-top: 6px; border-top: 1px solid var(--border); margin-top: 6px; }

  .row { display: flex; gap: 8px; margin-top: 8px; }
  .btn { padding: 6px 11px; border: 1px solid var(--border); background: var(--card); border-radius: 8px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .btn.primary:hover { color: var(--accent-text); opacity: .9; }
  .btn.link { border: 0; background: none; color: var(--accent); padding: 2px 4px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 4px 3px 10px; background: var(--bot); border-radius: 999px; font-size: 12px; }
  .chip button { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 14px; line-height: 1; padding: 0 5px; }
  .chip button:hover { color: var(--x-fg); }

  .found { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
  .found .head { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 6px; }
  .res { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .res:last-child { border-bottom: 0; }
  .res .t { flex: 1; min-width: 0; }
  .res .n { font-weight: 600; }
  .res .m { color: var(--muted); font-size: 12px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 6px; }

  /* badges */
  .b { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .b i { font-style: normal; font-weight: 700; }
  .b-c { color: var(--c-fg); background: var(--c-bg); }
  .b-r { color: var(--r-fg); background: var(--r-bg); }
  .b-x { color: var(--x-fg); background: var(--x-bg); }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; color: var(--muted); font-size: 12px; margin: 8px 0; }

  /* center */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
  .tabs button { padding: 8px 14px; border: 0; background: none; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .toolbar .search { max-width: 360px; }
  .toolbar label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .strip { background: var(--bot); border-radius: 10px; padding: 9px 12px; margin: 10px 0; }
  .empty { text-align: center; padding: 50px 20px; color: var(--muted); }
  .empty h3 { color: var(--text); margin: 0 0 6px; }
  .tablewrap { overflow: auto; border: 1px solid var(--border); border-radius: 10px; max-height: calc(100vh - 250px); }
  table.cmp { border-collapse: separate; border-spacing: 0; width: 100%; }
  table.cmp th, table.cmp td { padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
  table.cmp thead th { position: sticky; top: 0; z-index: 3; background: var(--panel); vertical-align: top; min-width: 150px; }
  table.cmp .corner, table.cmp tbody th { position: sticky; left: 0; z-index: 2; background: var(--card); min-width: 230px; max-width: 260px; font-weight: 500; }
  table.cmp thead .corner { z-index: 4; background: var(--panel); }
  table.cmp tr.meta td, table.cmp tr.meta th { background: var(--panel); font-weight: 600; }
  table.cmp tr.hl td, table.cmp tr.hl th { background: var(--hl); }
  table.cmp td.ask { cursor: pointer; }
  table.cmp td.ask:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
  .ph .tier { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .ph .nm { font-weight: 700; cursor: pointer; }
  .ph .nm:hover { color: var(--accent); }
  .ph .pr { color: var(--muted); font-weight: 400; }
  .ph .rm { float: right; border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1; }
  .ph .rm:hover { color: var(--x-fg); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
  .pcard h3 { margin: 0 0 2px; font-size: 16px; }
  .pcard .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .pcard dl { margin: 0; } .pcard dt { font-weight: 600; margin-top: 9px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .pcard dd { margin: 2px 0 0; } .pcard ul { margin: 2px 0 0; padding-left: 18px; }

  /* chat */
  .chat .hd { padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .chat .hd .row1 { display: flex; align-items: center; gap: 8px; }
  .chat .hd strong { flex: 1; }
  .mode { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: var(--accent-text); }
  .mode.off { background: var(--r-bg); color: var(--r-fg); }
  #scope { color: var(--muted); font-size: 12px; margin-top: 3px; }
  #log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg:has(table) { max-width: 100%; overflow-x: auto; }
  .msg { max-width: 94%; padding: 8px 12px; border-radius: 14px; overflow-wrap: anywhere; }
  .msg p { margin: 0 0 7px; } .msg p:last-child { margin-bottom: 0; }
  .msg ul { margin: 0 0 7px; padding-left: 18px; } .msg ul:last-child { margin-bottom: 0; }
  .bot { background: var(--bot); border-bottom-left-radius: 4px; align-self: flex-start; }
  .user { background: var(--accent); color: var(--accent-text); border-bottom-right-radius: 4px; align-self: flex-end; }
  .dots span { display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite both; }
  .dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  table.mini { border-collapse: collapse; width: 100%; margin-top: 8px; background: var(--card); border-radius: 8px; overflow: hidden; font-size: 12.5px; }
  table.mini th, table.mini td { padding: 5px 8px; border-bottom: 1px solid var(--border); text-align: left; }
  table.mini td, table.mini thead th { white-space: nowrap; }
  table.mini tbody th { min-width: 90px; }
  table.mini thead th { background: var(--panel); color: var(--muted); font-weight: 600; }
  table.mini tr:last-child td, table.mini tr:last-child th { border-bottom: 0; }
  #sugg { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 8px; }
  #sugg button { font-size: 12.5px; padding: 5px 10px; border-radius: 999px; cursor: pointer; border: 1px solid var(--accent); background: transparent; color: var(--accent); }
  #sugg button:hover { background: var(--accent); color: var(--accent-text); }
  #form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); }
  #input { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); }
  #send { padding: 0 16px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-text); font-weight: 600; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: default; }
  .foot { padding: 0 12px 8px; font-size: 11px; color: var(--muted); text-align: center; }

  /* narrower iframes: chat becomes a tab */
  @media (max-width: 1100px) {
    main { grid-template-columns: 310px minmax(0, 1fr); }
    .mtabs { display: flex; }
    .chat { display: none; grid-column: 2; border-left: 0; }
    body.view-chat .chat { display: flex; }
    body.view-chat .center { display: none; }
  }
  @media (max-width: 760px) {
    main { grid-template-columns: minmax(0, 1fr); }
    .left { border-right: 0; max-height: 46vh; }
    body.view-chat .left { display: none; }
    .chat { grid-column: 1; }
  }
</style>
</head>
<body>
<div class="top">
  <strong>Hospital policy explorer</strong>
  <span class="sub" id="asof"></span>
  <div class="mtabs"><button type="button" data-view="explore" class="on">Explore</button><button type="button" data-view="chat">Chat</button></div>
</div>
<main>
  <aside class="left">
    <section class="card">
      <h2>Products</h2>
      <div id="prodPicker"></div>
      <div class="chips" id="selChips"></div>
      <div class="row"><button type="button" class="btn" id="selAll">Select all</button><button type="button" class="btn" id="selNone">Clear</button></div>
    </section>
    <section class="card">
      <h2>Find a policy</h2>
      <label class="f">Must cover</label>
      <div id="svcPicker"></div>
      <label class="f" for="level">Cover level</label>
      <select id="level">
        <option value="c">Fully covered only</option>
        <option value="cr">Covered or restricted</option>
      </select>
      <label class="f" for="maxPrem">Max monthly premium</label>
      <select id="maxPrem">
        <option value="">Any price</option><option value="120">$120 or less</option><option value="150">$150 or less</option>
        <option value="200">$200 or less</option><option value="250">$250 or less</option><option value="300">$300 or less</option>
        <option value="400">$400 or less</option>
      </select>
      <div class="found" id="found"></div>
    </section>
  </aside>

  <section class="center">
    <div class="tabs"><button type="button" data-tab="compare" class="on">Compare</button><button type="button" data-tab="details">Policy details</button></div>
    <div id="tab-compare">
      <div class="toolbar">
        <input class="search" id="svcSearch" type="search" placeholder="Search services, e.g. knee replacement, dental, mental health" aria-label="Search services">
        <label><input type="checkbox" id="diffOnly"> Differences only</label>
      </div>
      <div id="strip"></div>
      <div class="legend">
        <span><span class="b b-c"><i>✓</i> Covered</span></span>
        <span><span class="b b-r"><i>R</i> Restricted</span> partly covers costs as a private patient in a public hospital</span>
        <span><span class="b b-x"><i>✕</i> Not covered</span></span>
      </div>
      <div id="cmp"></div>
    </div>
    <div id="tab-details" hidden></div>
  </section>

  <aside class="chat">
    <div class="hd">
      <div class="row1"><strong>Ask about these products</strong><span class="mode off" id="mode">Offline</span></div>
      <div id="scope"></div>
    </div>
    <div id="log" role="log" aria-live="polite"></div>
    <div id="sugg"></div>
    <form id="form" autocomplete="off">
      <input id="input" type="text" maxlength="500" placeholder="Ask a question…" aria-label="Your question">
      <button id="send" type="submit">Send</button>
    </form>
    <div class="foot" id="foot">General information only, not advice. Check details with Bupa.</div>
  </aside>
</main>

  function updateScope() {
    var S = selPolicies();
    $("scope").textContent = S.length ? "Asking about: " + shorts(S).join(", ") : "Asking about: all " + P.length + " policies (choose products to narrow)";
    if (!state.busy) setSugg(startersFor(state.sel));
  }
  function setMode(ai) {
    state.ai = ai;
    var m = $("mode"); m.textContent = ai ? "Claude AI" : "Offline"; m.className = "mode" + (ai ? "" : " off");
    m.title = ai ? "Answers come from Claude, using the policies you've selected." : "Answers are built from the saved policy data. Open this page from the server to use Claude AI.";
  }
  function showResult(bubble, res) {
    bubble.innerHTML = render(res.paras.join("\n\n")) + (res.table ? tableHTML(res.table) : "");
    setSugg(res.chips || []);
  }
  function ask(q, idsOverride) {
    q = q.trim();
    if (state.busy || !q) return;
    var ids = idsOverride || state.sel;
    state.busy = true; send.disabled = true; $("sugg").innerHTML = "";
    addMsg("user", escHtml(q));
    var bubble = addMsg("bot", '<span class="dots"><span></span><span></span><span></span></span>');
    function finish() { state.busy = false; send.disabled = false; log.scrollTop = log.scrollHeight; input.focus(); }
    function offline() {
      setTimeout(function () { showResult(bubble, answer(q, ids)); finish(); }, 350 + Math.random() * 250);
    }
    if (!state.ai) return offline();
    state.history.push({ role: "user", content: q });
    var reply = "";
    fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: state.history, policies: ids }) })
      .then(function (res) {
        if (!res.ok || !res.body) { return res.text().then(function (t) { throw { status: res.status, text: t }; }); }
        var reader = res.body.getReader(), dec = new TextDecoder();
        function pump() {
          return reader.read().then(function (r) {
            if (r.done) return;
            reply += dec.decode(r.value, { stream: true });
            bubble.innerHTML = render(reply); log.scrollTop = log.scrollHeight;
            return pump();
          });
        }
        return pump();
      })
      .then(function () { state.history.push({ role: "assistant", content: reply }); setSugg(startersFor(state.sel).slice(0, 3)); finish(); })
      .catch(function (err) {
        state.history.pop();
        if (err && err.status === 429) { bubble.innerHTML = render(err.text || "Please wait a moment and try again."); finish(); return; }
        showResult(bubble, answer(q, ids));   // AI unavailable: fall back to the offline answers
        finish();
      });
  }
  $("form").addEventListener("submit", function (e) { e.preventDefault(); var q = input.value; input.value = ""; ask(q); });

  /* ---------- start ---------- */
  var dates = P.map(function (p) { return p.updated; }).filter(Boolean).map(function (d) { return { d: d, t: Date.parse(d) }; }).filter(function (x) { return !isNaN(x.t); }).sort(function (a, b) { return b.t - a.t; });
  $("asof").textContent = P.length + " Bupa hospital policies (Queensland) · from PrivateHealth.gov.au" + (dates.length ? ", latest statement " + dates[0].d : "") + " · general information, not advice";
  addMsg("bot", render("Hi! Choose products on the left, search the services in the table, or ask me anything about them, like \"which policies cover dental and heart under $250?\""));
  var m = (location.hash || "").match(/p=([^&]*)/);
  var fromHash = m && m[1] ? m[1].split(",").map(function (x) { return "BUP_" + decodeURIComponent(x); }).filter(function (i) { return BYID[i]; }) : [];
  setSel(fromHash);
  renderFind();
  if (location.protocol === "file:") setMode(false);
  else fetch("/api/info").then(function (r) { return r.json(); }).then(function (i) { setMode(!!i.ai); }).catch(function () { setMode(false); });
})();
</script>
</body>
</html>
